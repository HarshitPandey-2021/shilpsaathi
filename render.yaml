services:
  # ============================================================================
  # 1. Python AI Image Enhancement Service (FastAPI / Uvicorn / Docker)
  # ============================================================================
  - type: web
    name: shilpsaathi-ai
    runtime: docker
    plan: free
    region: oregon
    rootDir: ai-service
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

  # ============================================================================
  # 2. Backend Express API Web Service (Node.js)
  # ============================================================================
  - type: web
    name: shilpsaathi-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "https://shilpsaathi.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: AI_IMAGE_SERVICE_URL
        fromService:
          type: web
          name: shilpsaathi-ai
          property: host
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: product-images
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      - key: BHASHINI_USER_ID
        sync: false
      - key: BHASHINI_API_KEY
        sync: false
      - key: BHASHINI_INFERENCE_API_KEY
        sync: false
      - key: BHASHINI_PIPELINE_ID
        value: "64392f96daac500b55c543d6"
